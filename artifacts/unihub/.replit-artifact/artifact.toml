kind = "mobile"
previewPath = "/"
title = "UniHub - Ontario University Hub"
version = "1.0.0"
id = "artifacts/unihub"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
localPort = 23981
name = "expo"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/unihub run dev"

[services.env]
PORT = "23981"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/unihub", "run", "build"]
run = ["pnpm", "--filter", "@workspace/unihub", "run", "serve"]
