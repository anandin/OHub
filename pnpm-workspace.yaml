# ============================================================================
# SECURITY: Minimum release age for npm packages (supply-chain attack defense)
# ============================================================================
#
# Any npm package version must have been published for at least 1 day (1440
# minutes) before pnpm will install it. Malicious npm releases are usually
# discovered and pulled within hours, so a 1-day delay is a strong safety
# buffer against the single most common attack vector in the npm ecosystem.
#
# DO NOT DISABLE THIS SETTING. If you genuinely need a package before the
# window elapses (e.g. an urgent security fix), add it to
# `minimumReleaseAgeExclude` below and remove the exclusion afterwards.
# ============================================================================
minimumReleaseAge: 1440

# Single-package repository: the Expo app lives at the repo root. The workspace
# file is retained for the security setting above and the version catalog below.
packages: []

catalog:
  '@tanstack/react-query': ^5.90.21
  '@types/react': ^19.2.0
  '@types/react-dom': ^19.2.0
  # Must be this exact version because expo requires it
  react: 19.1.0
  # Must be this exact version because expo requires it
  react-dom: 19.1.0
  zod: ^3.25.76
